<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRFP — Navegador de Campos | K.Motion Enterprise 3PL</title>
<style>
  :root{
    --blueberry:#1C2543;
    --blueberry-2:#223262;
    --classic:#0F4C81;
    --raspberry:#92223E;
    --ink:#22303C;
    --muted:#5C6B7A;
    --line:#C9D2E2;
    --alt:#F4F6FA;
    --code-bg:#F2F5FA;
    --warn-bg:#FBF0F3;
    --sans:'Segoe UI',Carlito,'DejaVu Sans',Arial,sans-serif;
    --mono:ui-monospace,Consolas,'Cascadia Mono','DejaVu Sans Mono',monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

  /* ---------- brand bar ---------- */
  .brandbar{background:linear-gradient(40deg,#1C2543 0%,#1C2543 40%,#223262 90%);color:#fff;padding:22px 26px 18px;border-bottom:3px solid var(--classic)}
  .brandbar .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9FB0CE;margin:0 0 6px}
  .brandbar h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.01em}
  .brandbar h1 span{font-family:var(--mono);font-weight:700;color:#fff;background:rgba(255,255,255,.12);padding:1px 9px;border-radius:4px;font-size:24px;margin-right:8px}
  .brandbar p{margin:8px 0 0;font-size:13.5px;color:#C6D2E6;max-width:78ch}
  .brandbar .src{margin-top:10px;font-size:11.5px;color:#8FA2C2;font-family:var(--mono)}

  .brandbar .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .brandbar h1 i{font-style:normal}
  .lang{display:flex;flex:none;border:1px solid rgba(255,255,255,.35);border-radius:4px;overflow:hidden}
  .lang button{border:0;background:transparent;color:#C6D2E6;font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 12px;cursor:pointer}
  .lang button+button{border-left:1px solid rgba(255,255,255,.28)}
  .lang button:hover{color:#fff;background:rgba(255,255,255,.10)}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--blueberry)}

  /* ---------- impact map (signature) ---------- */
  .impact{padding:16px 26px 14px;border-bottom:1px solid var(--line);background:#fff}
  .impact h2{margin:0 0 3px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--classic);font-weight:700}
  .impact .hint{margin:0 0 11px;font-size:12.5px;color:var(--muted)}
  .progs{display:flex;flex-wrap:wrap;gap:6px}
  .prog{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:#fff;border-radius:3px;padding:5px 9px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--blueberry);font-weight:600;transition:background .12s,border-color .12s,color .12s}
  .prog b{font-family:var(--sans);font-weight:600;font-size:11px;color:var(--muted)}
  .prog:hover{border-color:var(--classic)}
  .prog[aria-pressed="true"]{background:var(--blueberry);border-color:var(--blueberry);color:#fff}
  .prog[aria-pressed="true"] b{color:#A9BBDA}

  /* ---------- toolbar ---------- */
  .toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 26px;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .search{flex:1 1 320px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:4px;padding:7px 11px;background:#fff}
  .search:focus-within{border-color:var(--classic);box-shadow:0 0 0 3px rgba(15,76,129,.11)}
  .search input{border:0;outline:0;flex:1;font:inherit;font-size:14px;color:var(--ink);background:transparent}
  .search svg{flex:none;color:var(--muted)}
  .count{font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
  .tgl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .tgl input{accent-color:var(--classic);width:15px;height:15px}
  .clear{border:1px solid var(--line);background:#fff;border-radius:3px;padding:6px 10px;font:inherit;font-size:12.5px;color:var(--raspberry);cursor:pointer}
  .clear:hover{background:var(--warn-bg);border-color:var(--raspberry)}

  /* ---------- layout ---------- */
  .wrap{display:grid;grid-template-columns:246px minmax(0,1fr);align-items:start}
  nav.rail{position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto;border-right:1px solid var(--line);padding:16px 0 40px;background:var(--alt)}
  .grp{padding:14px 18px 5px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .grp:first-child{padding-top:2px}
  .tab{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 18px 7px 16px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
  .tab:hover{background:#E8EDF6}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
  .tab[aria-current="true"]{background:#fff;border-left-color:var(--raspberry);font-weight:600;color:var(--blueberry)}
  .tab[aria-current="true"] .n{color:var(--classic)}

  main{padding:24px 30px 90px;min-width:0}
  .tabhead{border-bottom:2px solid var(--classic);padding-bottom:10px;margin-bottom:6px}
  .tabhead h2{margin:0;font-size:22px;color:var(--blueberry);font-weight:600}
  .tabhead h2 code{font-family:var(--mono);font-size:15px;background:var(--code-bg);border:1px solid var(--line);border-radius:3px;padding:1px 7px;color:var(--classic);margin-left:9px;vertical-align:middle}
  .tabhead p{margin:9px 0 0;font-size:14px;color:var(--muted);max-width:88ch}

  /* ---------- field card ---------- */
  .card{border:1px solid var(--line);border-radius:5px;margin-top:16px;overflow:hidden;background:#fff}
  .card>header{padding:12px 16px 11px;border-bottom:1px solid var(--line);background:var(--alt)}
  .fname{margin:0;font-size:15.5px;font-weight:600;color:var(--blueberry);font-family:var(--mono);letter-spacing:-.01em}
  .fpt{margin:5px 0 0;font-size:14px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:3px;background:#fff;border:1px solid var(--classic);color:var(--classic)}
  .chip.res{border-color:var(--raspberry);color:var(--raspberry);background:var(--warn-bg);font-family:var(--sans);letter-spacing:.02em}
  .chip.cust{border-color:#8A6D1F;color:#8A6D1F;background:#FCF8EC;font-family:var(--sans)}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 16px;font-size:13.7px;vertical-align:top;border-top:1px solid #E4E9F2}
  tr:first-child td{border-top:0}
  tr:nth-child(even) td{background:var(--alt)}
  td.v{width:30%;min-width:150px;font-family:var(--mono);font-size:12.4px;color:var(--blueberry);font-weight:600}
  td.v em{font-style:normal;color:var(--raspberry);font-family:var(--sans);font-size:11px;display:block;font-weight:600;margin-top:2px}
  .note{padding:11px 16px;font-size:13.2px;color:var(--ink);background:var(--code-bg);border-top:1px solid var(--line);border-left:3px solid var(--classic)}
  .note.warn{background:var(--warn-bg);border-left-color:var(--raspberry)}
  .note b{color:var(--blueberry)}
  .note.warn b{color:var(--raspberry)}
  .note code,.fpt code,td code{font-family:var(--mono);font-size:12.3px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:0 4px}

  .empty{margin-top:40px;padding:26px;border:1px dashed var(--line);border-radius:5px;text-align:center;color:var(--muted);font-size:14px}
  .srctag{display:inline-block;margin-top:26px;font-family:var(--mono);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;width:100%}
  mark{background:#FFF0A8;color:inherit;padding:0 1px;border-radius:2px}

  @media (max-width:880px){
    .wrap{grid-template-columns:1fr}
    nav.rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;padding:8px}
    .grp{width:100%;padding:8px 10px 2px}
    .tab{width:auto;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
    .tab[aria-current="true"]{border-left:0;border-bottom-color:var(--raspberry)}
    main{padding:18px 16px 70px}
    .brandbar,.impact,.toolbar{padding-left:16px;padding-right:16px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  <div class="topline">

t("misc2|RF Relocation Executed by","Qué lectura dispara la ejecución de la reubicación.",

t("misc2|Allow Mixed Pallet","Reubicación de pallet mixto en una sola acción.",

/* ---------- MISCELLANEOUS (3) ---------- */
t("misc3|Other Inventory Count Programs","En qué programas RF, además de RFPIC, se ejecuta el count back.",

/* ---------- MISCELLANEOUS (4) ---------- */
t("misc4|Allow Replenishment of Multiple Pallets in RFRP","Reabastece varios pallets en un solo paso.",

t("misc4|Allow Mixed Put-Away, Move up to Inventory Level","Hasta qué nivel de inventario los pallets mezclados pueden moverse juntos.",
 ["Pallets con niveles 2, 3 y 4 distintos pueden ir juntos","Mezcla permitida hasta el nivel 2","Mezcla permitida hasta el nivel 3","El producto mixto no puede moverse en un solo paso"],
 "Ejemplo del manual: con «Up to level 1», pallets de recepciones, citas y cargas de entrada <b>distintas</b> pueden ir en el mismo montacargas y almacenarse juntos. Este es uno de los pocos campos de MRFP que alcanza <b>seis programas a la vez</b>.");
t("misc4|Reason Code Required to Override System-Assigned Location","Exige código de motivo cuando el operador sobrescribe la ubicación sugerida.",
 ["Código de motivo obligatorio al sobrescribir la ubicación o pedir una alternativa","Sin código de motivo","Reservado para uso futuro"],
 "<b>Solo para overrides en RFCH/RFPU</b> el código de motivo se graba en la línea de la recepción y se crea un time stamp. Es la contraparte investigativa de <code>Max. Number of F3 (NX)</code>: uno limita, este registra.");
t("misc4|Max. Number of F3 (NX) Allowed Per ILOP Sequence in RFRL","Cuántas veces el operador puede pedir otra ubicación sugerida en la reubicación.",

 ["El breakdown aparece como pop-up en RFPIC, RFPK, RFRL, RFPR, RFRP, RFCH y RFPU","No aparece"]);
t("misc4|Allow Skipping of Inbound Serial Number Validation in RFOPS","Dispensa la validación del número de serie de entrada en la expedición.",
 ["La validación puede saltarse y el sistema genera un nuevo número de serie de salida","La validación es obligatoria"],
 "Existe para eliminar el escaneo de validación caja por caja. Flujo en el terminal: el operador elige <b>ME (Manual Entry)</b>, informa el peso y presiona <b>F1 (SE)</b> para generar el número de serie. Caso de uso citado: pedido de transferencia de producto serializado entre cuentas.");
t("misc4|Allow Weight Reduction for Standard Weight Item in RFOPS","Reduce producto de peso estándar informando cantidad en vez de peso.",
 ["El operador reduce informando una cantidad — ej.: 5CS — que debe ser menor o igual a la cantidad del pedido","No permitido"],

t("misc4|Enter Gross Weight in RFSC","Exige peso bruto al cerrar la caja en la cartonización.",
 ["El operador informa el peso bruto al cerrar la caja","No se solicita"],
 "La unidad de medida de peso de la caja se define en <b>DITP</b> (Depositor Item Profile).");
t("misc4|Allow Put-Back of Outstanding REPI Quantity","Qué hacer con el saldo cuando el reabastecimiento es parcial.",
 ["Se crea un segundo reabastecimiento con el saldo para la pick line original","Se invita al operador a ejecutar el segundo reabastecimiento — en la pick line original o en otra","Si el saldo en la pick line es MAYOR que la cantidad on order, el segundo reabastecimiento se borra; si no lo es, se crea para la pick line original (igual que No)"],
 "Escenario del manual: quiebre de 50 cajas/pallet, reabastecimiento de 45 cajas del bulk (producto bloqueado o dañado impidió el pallet completo), pedido de 10 cajas — el saldo pendiente es de 5 cajas.");
t("misc4|Enable UI Scanning in Cycle Counts","Lectura de UI en el conteo cíclico.",["Solo para uso personalizado"]);
t("misc4|Suspend Flow Advancement in Outbound Audit","Impide el avance de flujo aunque la auditoría cierre correcta.",
 ["La línea del pedido NO avanza de flujo aunque el conteo coincida con la cantidad","La línea avanza cuando el conteo coincide"]);

/* ---------- MISCELLANEOUS (5) ---------- */
t("misc5|Retain OPID to in RFMG","Mantiene el OPID destino en pantalla después del merge.",
 ["El valor de OPID destino permanece en pantalla para que el operador siga consolidando en el mismo OPID","El campo se limpia en cada merge"]);
t("misc5|Validate Manual Entry Process in RFOPS","Validaciones aplicadas cuando el operador digita peso variable o número de serie en vez de escanear.",
 ["Tres validaciones: el largo y el tipo de dato deben coincidir con el setup de IPRO; el peso/serie de SALIDA debe coincidir con el de ENTRADA; y, si el peso no coincide, debe estar dentro del porcentaje de tolerancia definido en ITEM","Solo el largo y el tipo de dato deben coincidir con IPRO"],
 "<b>Es este campo — y no el flag Inbound/Outbound = B de IPRO — el que activa la comparación entrada vs. salida.</b> IPRO con B solo solicita la captura en ambas puntas. La comparación también requiere <code>Transfer Value to Inventory = Y</code> en IPRO. Punto abierto para validación empírica: el texto 4.2 habla de «manually entering», sin aclarar si el alcance cubre también valores escaneados.");
t("misc5|Disallow REPI When Location Reaches Maximum Capacity","Cancela reabastecimientos que excederían la capacidad de la pick line.",
 ["El reabastecimiento se cancela cuando cantidad a reabastecer + saldo en la pick line excede la capacidad de la ubicación","El reabastecimiento no se cancela"],
 "<b>Dos salvedades:</b> el producto en hold <code>SUSP</code> no entra en el saldo de la pick line; y la opción Yes <b>se ignora</b> si hay override de shelf life en CCOP para el pedido que disparó el reabastecimiento.");
t("misc5|Validate Serial Number (SN) From Picking Process","Reverificación del número de serie en el momento del packing.",
 ["Validación activa en RFSC — debe leerse un número de serie válido para todo producto empacado","Validación desactivada en RFSC"],
 "La finalidad del escaneo adicional es garantizar que <b>el número de serie leído en RFPIC sea el mismo que está entrando en la caja</b> durante el packing.");
t("misc5|Display Minimum Number of REPI Records in Demand Mode","Muestra solo los reabastecimientos necesarios para atender el pedido.",
 ["Solo aparecen los reabastecimientos necesarios para cubrir la cantidad del pedido; los que existen solo para alcanzar el mínimo de la ubicación no aparecen en modo demanda","Aparecen todos"],
 "Ejemplo del manual: 255 cajas en la pick location, 305 on order. Existen tres reabastecimientos que suman 144 cajas, pero solo 60 son necesarias para el pedido — <b>solo aparece el reabastecimiento de 60</b> en demand mode.");
t("misc5|Override Quantity Breakdown - Actual (if > Std) or Std","Elige entre el quiebre real del pallet y el quiebre estándar del artículo.",
 ["Aplica las tres reglas descritas abajo en RFCH y RFMI","Comportamiento estándar"],
 "<b>Reglas:</b> si la cantidad del pallet asociada a la UI es MENOR que el quiebre estándar del artículo, usa el quiebre estándar; si es MAYOR O IGUAL, usa el quiebre real; y, en quiebre pallet/caja/unidad, la configuración caja/unidad no cambia. <b>Atención:</b> el quiebre informado en RFCH sobrescribe el quiebre de ENRE y del EDI.");
t("misc5|Display Process Description in RFOPS","Muestra la descripción del process code además del código.",
 ["Muestra la descripción del item process code","Muestra solo el código, sin descripción"]);
t("misc5|Allow Entry of Adjustment Code in RFMI","Si el operador informa el código de ajuste en el merge de inventario.",
 ["El operador informa el código de ajuste del merge","Usa el código de ajuste por defecto configurado en ATMP (Action Template Setup)"]);
t("misc5|REPI Pick Location Capacity Based on UI","Si la capacidad de la pick line se mide en UIs o en unidades.",
 ["La capacidad se mide por la CANTIDAD DE UIs — con capacidad de dos pallets y dos UIs en la ubicación, se considera llena aunque las dos UIs sean pallets parciales","La capacidad se mide por la cantidad real de unidades"],
 "Ubicación considerada llena = <b>ningún reabastecimiento ocurre</b>. Con Yes, dos pallets parciales traban el reabastecimiento; es una de las causas más comunes de pick line que no se reabastece.");
</script>
<script>
const railEl=document.getElementById("rail"),mainEl=document.getElementById("main"),
      qEl=document.getElementById("q"),cntEl=document.getElementById("count"),
      progsEl=document.getElementById("progs"),hideResEl=document.getElementById("hideRes"),
      clrEl=document.getElementById("clr"),langEl=document.querySelector(".lang");
let active=TABS[0].id, prog=null, lang="pt";

/* ---------- UI strings ---------- */
const UI={
 pt:{title:"RF Profile — Navegador de Campos",
     intro:"Todos os campos do perfil de RF, aba por aba: o que cada um faz, quais valores aceita e em quais programas RF ele age. O MRFP define os valores default e as opções disponíveis nos programas RF principais e, depois de criado, precisa ser anexado ao(s) cliente(s) em CUST.",
     src:"Fonte: H_RF_Guide_4_2_upd2_Classic.md · cap. GENERAL SETUP PROGRAMS · pp. 16–83",
     mapH:"Mapa de impacto",
     mapP:"Cada programa RF abaixo é tocado por N campos do MRFP. Clique para filtrar apenas os campos que afetam aquele programa.",
     ph:"Buscar campo, valor ou comportamento…",
     hide:"Ocultar campos reservados/custom", clear:"Limpar filtros",
     one:" campo", many:" campos",
     res:"Reservado para uso futuro", cust:"Customizado / hardware específico",
     tab:"aba ", results:"Resultados",
     resSub:"Campos de todas as 17 abas do MRFP que atendem ao filtro. Cada cartão indica a aba de origem.",
     search:"busca", program:"programa",
     empty:"Nenhum campo corresponde a esse filtro. Tente outro termo ou limpe os filtros.",
     foot:c=>"MRFP · "+c+" campos mapeados em 17 abas · H_RF_Guide_4_2_upd2_Classic.md, cap. General Setup Programs, pp. 16–83 · versão de produção 6.2 pode conter campos adicionais",
     nav:"Abas do MRFP"},
 es:{title:"RF Profile — Navegador de Campos",
     intro:"Todos los campos del perfil de RF, pestaña por pestaña: qué hace cada uno, qué valores acepta y en qué programas RF actúa. MRFP define los valores por defecto y las opciones disponibles en los programas RF principales y, una vez creado, debe vincularse al o a los clientes en CUST.",
     src:"Fuente: H_RF_Guide_4_2_upd2_Classic.md · cap. GENERAL SETUP PROGRAMS · pp. 16–83",
     mapH:"Mapa de impacto",
     mapP:"Cada programa RF de abajo es tocado por N campos de MRFP. Haga clic para filtrar solo los campos que afectan a ese programa.",
     ph:"Buscar campo, valor o comportamiento…",
     hide:"Ocultar campos reservados/personalizados", clear:"Limpiar filtros",
     one:" campo", many:" campos",
     res:"Reservado para uso futuro", cust:"Personalizado / hardware específico",
     tab:"pestaña ", results:"Resultados",
     resSub:"Campos de las 17 pestañas de MRFP que cumplen el filtro. Cada tarjeta indica su pestaña de origen.",
     search:"búsqueda", program:"programa",
     empty:"Ningún campo coincide con ese filtro. Pruebe otro término o limpie los filtros.",
     foot:c=>"MRFP · "+c+" campos mapeados en 17 pestañas · H_RF_Guide_4_2_upd2_Classic.md, cap. General Setup Programs, pp. 16–83 · la versión de producción 6.2 puede tener campos adicionales",
     nav:"Pestañas de MRFP"}
};
const L=()=>UI[lang];

/* ---------- translated accessors ---------- */
const tr=f=>lang==="es"?(T[f.t+"|"+f.n]||null):null;
const fPt=f=>{const x=tr(f);return x&&x.s?x.s:f.pt};
const fD =f=>{const x=tr(f);return x&&x.d?x.d:(x&&lang==="es"&&!x.d?"":f.d)};
const fO =f=>{const x=tr(f);
  if(!x||!x.o) return f.o||[];
  return (f.o||[]).map((pair,i)=>[pair[0], x.o[i]!==undefined?x.o[i]:pair[1]]);};
const tabG=t=>lang==="es"&&TABS_ES[t.id]?TABS_ES[t.id][0]:t.g;
const tabS=t=>lang==="es"&&TABS_ES[t.id]?TABS_ES[t.id][1]:t.sum;

/* ---------- program impact map ---------- */
const tally={};
F.forEach(f=>(f.p||[]).forEach(p=>tally[p]=(tally[p]||0)+1));
const RF=Object.keys(tally).filter(p=>/^RF|^REPI$|^OLOP$/.test(p)).sort((a,b)=>tally[b]-tally[a]);
progsEl.innerHTML=RF.map(p=>`<button class="prog" data-p="${p}" aria-pressed="false">${p}<b>${tally[p]}</b></button>`).join("");
progsEl.addEventListener("click",e=>{
  const b=e.target.closest(".prog"); if(!b)return;
  prog = prog===b.dataset.p ? null : b.dataset.p;
  [...progsEl.children].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.p===prog)));
  render();
});

/* ---------- rail ---------- */
function buildRail(){
  let lastG="";
  railEl.setAttribute("aria-label",L().nav);
  railEl.innerHTML=TABS.map(t=>{
    const n=F.filter(f=>f.t===t.id).length, g=tabG(t);
    const head = g!==lastG ? `<div class="grp">${(lastG=g)}</div>` : "";
    return head+`<button class="tab" data-t="${t.id}"><span>${t.label}</span><span class="n">${n}</span></button>`;
  }).join("");
}
railEl.addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  active=b.dataset.t; qEl.value=""; render(); window.scrollTo({top:0});
});

/* ---------- language ---------- */
langEl.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.dataset.l===lang)return;
  lang=b.dataset.l;
  [...langEl.children].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.l===lang)));
  document.documentElement.lang=lang;
  applyChrome(); buildRail(); render();
});
function applyChrome(){
  const u=L();
  document.getElementById("tTitle").textContent=u.title;
  document.getElementById("tIntro").textContent=u.intro;
  document.getElementById("tSrc").textContent=u.src;
  document.getElementById("tMapH").textContent=u.mapH;
  document.getElementById("tMapP").textContent=u.mapP;
  document.getElementById("tHide").textContent=u.hide;
  qEl.placeholder=u.ph; clrEl.textContent=u.clear;
}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function hl(html,term){
  if(!term)return html;
  const rx=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return html.replace(/>([^<]+)</g,(m,txt)=>">"+txt.replace(rx,"<mark>$1</mark>")+"<");
}
function card(f,term,showTab){
  const u=L(), tab=TABS.find(t=>t.id===f.t);
  const chips=[...(f.p||[]).map(p=>`<span class="chip">${p}</span>`)];
  if(f.res)chips.push(`<span class="chip res">${u.res}</span>`);
  if(f.cust)chips.push(`<span class="chip cust">${u.cust}</span>`);
  if(showTab)chips.push(`<span class="chip" style="border-color:#C9D2E2;color:#5C6B7A">${u.tab}${tab.label}</span>`);
  const rows=fO(f).map(([v,b])=>`<tr><td class="v">${esc(v)}</td><td>${b}</td></tr>`).join("");
  const note=fD(f);
  const html=`<article class="card">
    <header>
      <h3 class="fname">${esc(f.n)}</h3>
      <p class="fpt">${fPt(f)}</p>
      <div class="chips">${chips.join("")}</div>
    </header>
    ${rows?`<table><tbody>${rows}</tbody></table>`:""}
    ${note?`<p class="note${f.res?" warn":""}">${note}</p>`:""}
  </article>`;
  return hl(html,term);
}
function render(){
  const u=L(), term=qEl.value.trim(), searching=term.length>1;
  let list=F;
  if(prog) list=list.filter(f=>(f.p||[]).includes(prog));
  if(hideResEl.checked) list=list.filter(f=>!f.res&&!f.cust);
  if(searching){
    const q=term.toLowerCase();
    list=list.filter(f=>{
      const hay=[f.n,f.pt,f.d||"",...(f.o||[]).flat(),fPt(f),fD(f)||"",...fO(f).map(r=>r[1])].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }else if(!prog){
    list=list.filter(f=>f.t===active);
  }
  const filtered = searching||prog;   /* mostra o chip da aba em QUALQUER modo filtrado */
  [...railEl.querySelectorAll(".tab")].forEach(b=>b.setAttribute("aria-current",String(!filtered&&b.dataset.t===active)));

  let head;
  if(filtered){
    const bits=[searching?`${u.search} «${esc(term)}»`:null,prog?`${u.program} ${prog}`:null].filter(Boolean).join(" · ");
    head=`<div class="tabhead"><h2>${u.results} <code>${bits}</code></h2><p>${u.resSub}</p></div>`;
  }else{
    const t=TABS.find(x=>x.id===active);
    head=`<div class="tabhead"><h2>${t.label}<code>${t.code}</code></h2><p>${tabS(t)}</p></div>`;
  }
  cntEl.textContent=list.length+(list.length===1?u.one:u.many);
  clrEl.hidden=!(searching||prog||hideResEl.checked);
  mainEl.innerHTML=head+(list.length
    ? list.map(f=>card(f,searching?term:"",filtered)).join("")
    : `<div class="empty">${u.empty}</div>`)
    +`<span class="srctag">${u.foot(F.length)}</span>`;
}
let deb;
qEl.addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(render,140)});
hideResEl.addEventListener("change",render);
clrEl.addEventListener("click",()=>{qEl.value="";hideResEl.checked=false;prog=null;
  [...progsEl.children].forEach(x=>x.setAttribute("aria-pressed","false"));render();window.scrollTo({top:0})});
applyChrome(); buildRail(); render();
</script>
